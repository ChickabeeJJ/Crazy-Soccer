<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crazy Soccer – Art Studio</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #000; }
      #stage { position: relative; overflow: hidden; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cover-logo { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 900; line-height: 0.84; letter-spacing: -0.01em; filter: drop-shadow(0 0.05em 0.14em rgba(0, 0, 0, 0.55)); }
      .cover-logo .lg-crazy { color: #ffffff; font-size: 1em; padding-left: 0.08em; }
      .cover-logo .lg-soccer { margin-top: 0.06em; color: #111; background: #ffcf3f; font-size: 1em; padding: 0.06em 0.26em 0.02em 0.16em; clip-path: polygon(0.2em 0, 100% 0, calc(100% - 0.2em) 100%, 0 100%); }
      .cover-logo .lg-bars { display: flex; gap: 0.06em; margin: 0.1em 0 0 0.12em; }
      .cover-logo .lg-bars i { display: block; width: 1.1em; height: 0.08em; transform: skewX(-24deg); }
      .cover-logo .lg-bars .r { background: #ff3b5c; } .cover-logo .lg-bars .b { background: #3b8bff; }
      .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 55% 50%, rgba(0,0,0,0) 45%, rgba(6,4,20,0.62) 100%), linear-gradient(180deg, rgba(6,4,24,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 75%, rgba(6,4,20,0.4) 100%); }
      #stage canvas { filter: contrast(1.12) saturate(1.18); }
      .flash { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas><div class="vignette"></div><div id="flash" class="flash"></div></div>
    <script type="module" src="./art.js"></script>
  </body>
</html>
