<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crazy Soccer – Art Studio</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #000; }
      #stage { position: relative; overflow: hidden; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cover-logo { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; }
      .cover-logo .burst { position: absolute; border-radius: 50%; background: repeating-conic-gradient(rgba(255,214,64,0.9) 0 10deg, rgba(255,120,40,0.85) 10deg 20deg); filter: blur(0.5px); mask: radial-gradient(circle, #000 40%, transparent 71%); -webkit-mask: radial-gradient(circle, #000 40%, transparent 71%); z-index: -1; }
      .cover-logo .w { font-family: 'Lilita One', 'Arial Black', sans-serif; line-height: 0.8; letter-spacing: 0.01em; paint-order: stroke fill; transform: rotate(-6deg); filter: drop-shadow(0 0.08em 0 rgba(27,21,48,0.9)) drop-shadow(0 0.18em 0.25em rgba(0,0,0,0.35)); }
      .cover-logo .w1 { color: #ffd23f; }
      .cover-logo .w2 { color: #ffffff; }
      .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(20,10,40,0.35) 100%); }
      .flash { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas><div class="vignette"></div><div id="flash" class="flash"></div></div>
    <script type="module" src="./art.js"></script>
  </body>
</html>
